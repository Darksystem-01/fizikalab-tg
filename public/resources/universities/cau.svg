<!doctype html>
<html lang="en">
<head><title>429</title>
<style>
body{margin:0;background:#f0f0f0;display:flex;justify-content:center;align-items:center;min-height:100vh}
#page{display:block;width:100%;max-width:490px;margin:auto;font:100 16px Tahoma,Arial,sans-serif;box-sizing:border-box;padding:0 16px}
#logo{display:block;max-width:100%;height:auto}
#title{font-weight:100;font-size:26px;margin:50px 0 0}
#description{font-weight:100;margin:30px 0}
#rule{margin:30px 0}
#contact{font-size:14px}
#contact-mail{color:#fe8659;text-decoration:none}
#contact-mail:hover{text-decoration:underline}
</style>
</head>
<body>
  <div id="page">
    <img id="logo" src="https://static.tildacdn.one/img/tildacopy_black.png" alt="Tilda">
    <h1 id="title">Request with error: 429 Too Many Requests</h1>
    <p id="description">
      Your request has been automatically blocked by our system.<br>
      If this is the first time it has happened, try refreshing the page in 5 minutes.
    </p>
    <hr id="rule">
    <p id="contact">
      If the issue persists, please contact our Customer Support at
      <a id="contact-mail" href="mailto:team@tilda.cc">team@tilda.cc</a>
      for assistance.
    </p>
  </div>
</body>
</html>

